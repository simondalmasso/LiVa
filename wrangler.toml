name = "liva"
main = "dist/worker.mjs"
compatibility_date = "2026-10-08"
compatibility_flags = ["nodejs_compat"]

# Worker will be accessible at:
# https://liva.simondalmasso44.workers.dev

[vars]
PROJECT_VERSION = "4.2.0-LIVE-ARGENTINA"

# Secrets (set via `wrangler secret put` or API):
#   YOUTUBE_API_KEY
#   TWITCH_CLIENT_ID
#   TWITCH_CLIENT_SECRET

# Observability
[observability]
enabled = true

# Cache identical public catalogue responses before invoking Worker code.
# No KV / D1 / Durable Objects. Requires Wrangler 4.69+.
[cache]
enabled = true
